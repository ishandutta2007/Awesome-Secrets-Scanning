<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Neon Cyan/Purple Gradients -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="300" fill="url(#cyberGrid)" rx="16" />

  <!-- Animated Scanner Laser (CSS Keyframes) -->
  <style>
    @keyframes scanLine {
      0% { transform: translateY(20px); opacity: 0.3; }
      50% { transform: translateY(260px); opacity: 0.9; }
      100% { transform: translateY(20px); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0px 0px 8px rgba(0, 242, 254, 0.6)); }
      50% { filter: drop-shadow(0px 0px 20px rgba(127, 0, 255, 0.9)); }
    }
    @keyframes codePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .scanner-line {
      animation: scanLine 4s ease-in-out infinite;
    }
    .glowing-shield {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .code-text {
      animation: codePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Decorative Circuit Shapes & Code Background -->
  <g class="code-text" fill="#334155" font-family="monospace" font-size="14">
    <text x="50" y="60">API_KEY = "sk_live_994a28f801bc49..." [DETECTED]</text>
    <text x="50" y="90">AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxR..." [VERIFIED]</text>
    <text x="50" y="230">POSTGRES_PASSWORD = "super_secret_db_pass_2026" [REVOKED]</text>
    <text x="50" y="260">PRIVATE_KEY = "-----BEGIN PRIVATE KEY-----" [BLOCKED]</text>
  </g>

  <!-- Security Shield & Key Icon Group -->
  <g class="glowing-shield" transform="translate(180, 50)">
    <!-- Shield Outline -->
    <path d="M 100 20 L 180 50 C 180 140 100 180 100 180 C 100 180 20 140 20 50 Z" 
          fill="url(#shieldGradient)" stroke="#00f2fe" stroke-width="4" />
    <!-- Key Hole / Lock Icon inside Shield -->
    <circle cx="100" cy="85" r="18" fill="#ffffff" />
    <path d="M 92 98 L 108 98 L 112 135 L 88 135 Z" fill="#ffffff" />
    <circle cx="100" cy="85" r="8" fill="#0d1b2a" />
  </g>

  <!-- Laser Beam Bar -->
  <line class="scanner-line" x1="0" y1="0" x2="1200" y2="0" stroke="#00f2fe" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Main Banner Title & Subtitle -->
  <g transform="translate(420, 130)">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1.5">
      Awesome <tspan fill="url(#accentGradient)">Secrets Scanning</tspan>
    </text>

    <!-- Tagline -->
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="400" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      🔒 Detection, Verification & Protection for API Keys, Tokens & Credentials
    </text>

    <!-- Category Badges / Pills -->
    <g transform="translate(0, 85)">
      <!-- Pill 1: SaaS & Enterprise -->
      <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
      <text x="85" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#00f2fe" text-anchor="middle">⚡ SaaS Platforms</text>

      <!-- Pill 2: Open-Source -->
      <rect x="185" width="180" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="275" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🐙 Open-Source Tools</text>

      <!-- Pill 3: Push Protection -->
      <rect x="380" width="170" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="465" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ CI/CD & Push Gates</text>
    </g>
  </g>
</svg>
